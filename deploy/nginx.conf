# ─────────────────────────────────────────────
# nginx — VideoVault Pro
# التوقيع المختار: VPS واحد، التطبيق يستمع على 127.0.0.1، وnginx وحده
# يلامس الإنترنت (TLS + توجيه). لا تُفتح منفذ 4001 في الجدار الناري أبداً.
# ─────────────────────────────────────────────
#
# الاستعمال:
#   1) استبدل example.com باسمك real domain
#   2) certbot --nginx -d example.com -d www.example.com   (يملأ شهادة SSL)
#   3) ln -s /etc/nginx/sites-available/videovault /etc/nginx/sites-enabled/
#   4) nginx -t && systemctl reload nginx

# ── تحويل HTTP ⇒ HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # certbot يضيف شهادته هنا
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # حدّ حجم الطلب: يوافق express.json({ limit: "256kb" })
    client_max_body_size 512k;

    # ── ضغط + ترويسات أمان (مكرّرة مع helmet، لكن nginx يغطي الملفات الساكنة) ──
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── حدّ соединات: طبقة إضافية قبلexpress ──
    limit_req_zone $binary_remote_addr zone=videovault:10m rate=30r/s;

    # ═══ واجهة المستخدم (ملفات Vite المبنية) ═══
    root /var/www/videovault/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # توجيه SPA
    }

    # الأصول المبنية بالهاش ⇒ تخزين طويل
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ═══ الـAPI ═══
    location /api/ {
        limit_req zone=videovault burst=40 nodelay;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # ⚠️ سطر الأمان الأهم: $remote_addr وحده (يستبدل الترويسة).
        # لا تستخدم proxy_add_x_forwarded_for هنا: يضيف عنوان العميل إلى قيمة
        # الترويسة المرسلة من المتصفح، فتنجح محاولات تزويرها.
        # (التطبيق أصلاً يقرأ العنصر الأيمن فقط، فالنظام يبقى آمناً
        #  حتى لو غيّرت هذا السطر — لكن الاستبدال أظهر وأوضح.)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # yt-dlp قد يستغرق وقتاً طويلاً ⇒ لا تقطع الطلب
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

# الملفات الكبيرة: لا نخزّنها كاملة في الذاكرة
        proxy_buffering off;
        client_max_body_size 512k;
    }

    # ═══ ملفات التحميل: streams مباشرة من القرص ═══
    location /files/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # التواقيع تبقى صالحة حتى FILE_TTL_HOURS بعد آخر تعديل
        add_header Cache-Control "private, max-age=3600";
    }

    # لا تكشف محتويات المجلد ولا تسرد الملفات
    autoindex off;
    server_tokens off;
}